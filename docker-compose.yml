version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: botdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
  bot:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db/botdb
    depends_on:
      - db
volumes:
  postgres_data:
